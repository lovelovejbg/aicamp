<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 UTF-8로 지정합니다 -->
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 화면 폭에 맞게 보이도록 설정합니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 브라우저 탭에 표시되는 제목입니다 -->
  <title>현장 일정 날씨판</title>
  <!-- 디자인은 style.css 에서 불러옵니다 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="board">
    <!-- 머리말: 제목 + 오늘 날짜 -->
    <header class="board-header">
      <h1>현장 일정 날씨판</h1>
      <!-- app.js 가 이 자리에 오늘 날짜(yyyy-mm-dd)를 채워 넣습니다 -->
      <p class="today" id="today"></p>
    </header>

    <!-- F-01 오늘 일정 목록 -->
    <section>
      <h2>오늘 일정</h2>
      <table class="task-table">
        <thead>
          <tr>
            <th>일정</th>
            <th>지역</th>
            <th>구분</th>
            <th>담당</th>
          </tr>
        </thead>
        <!-- app.js 가 일정 데이터로 이 안의 행(tr)을 그립니다 -->
        <tbody id="task-list"></tbody>
      </table>
    </section>

    <!-- F-02 일정 추가 -->
    <section>
      <h2>일정 추가</h2>
      <form id="task-form" class="task-form">
        <label>
          일정
          <input type="text" name="title" placeholder="예: 공원 놀이시설 점검" maxlength="50" />
        </label>
        <label>
          지역
          <!-- 선택지(세종 · 대전 · 태안 · 보령)는 app.js 가 logic.js 의 목록으로 채웁니다 -->
          <select name="region"></select>
        </label>
        <label>
          구분
          <!-- 선택지(야외 · 고소 · 실내)도 app.js 가 채웁니다 -->
          <select name="kind"></select>
        </label>
        <label>
          담당
          <input type="text" name="owner" placeholder="예: 홍길동" maxlength="20" />
        </label>
        <button type="submit">추가</button>
      </form>
      <!-- 입력이 잘못됐을 때 안내 문구가 나오는 자리 -->
      <p class="form-message" id="form-message" role="alert"></p>
    </section>
  </main>

  <!--
    스크립트 순서가 중요합니다.
    logic.js(규칙)를 먼저 불러와야 app.js(화면)가 그 규칙을 쓸 수 있습니다.
    type="module" 을 쓰지 않는 이유: 더블클릭(file://)으로 열면 모듈 스크립트가 막히기 때문입니다.
  -->
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
